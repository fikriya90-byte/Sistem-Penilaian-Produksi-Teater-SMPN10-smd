<!DOCTYPE html>
<html class="dark" lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SP-PPT — Sistem Penilaian Produksi Pementasan Teater SMPN 10 Samarinda" />
  <title>SP-PPT | Sistem Penilaian Produksi Pementasan Teater</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind Config (mengikuti DESIGN.md) -->
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#101415",
            "surface-dim": "#101415",
            "surface-bright": "#363a3b",
            "surface-container-lowest": "#0b0f10",
            "surface-container-low": "#191c1e",
            "surface-container": "#1d2022",
            "surface-container-high": "#272a2c",
            "surface-container-highest": "#323537",
            "on-surface": "#e0e3e5",
            "on-surface-variant": "#c8c5d0",
            "inverse-surface": "#e0e3e5",
            "inverse-on-surface": "#2d3133",
            "outline": "#928f9a",
            "outline-variant": "#47464f",
            "primary": "#c4c1fb",
            "on-primary": "#2d2a5b",
            "primary-container": "#1e1b4b",
            "on-primary-container": "#8683ba",
            "secondary": "#ffb77d",
            "on-secondary": "#4d2600",
            "secondary-container": "#d97707",
            "on-secondary-container": "#432100",
            "tertiary": "#b4c5ff",
            "on-tertiary": "#002a78",
            "tertiary-container": "#001d58",
            "on-tertiary-container": "#5382ff",
            "error": "#ffb4ab",
            "on-error": "#690005",
            "error-container": "#93000a",
            "on-error-container": "#ffdad6",
            "background": "#101415",
            "on-background": "#e0e3e5"
          },
          borderRadius: {
            DEFAULT: "0.25rem",
            lg: "0.5rem",
            xl: "0.75rem",
            "2xl": "1rem",
            full: "9999px"
          },
          fontFamily: {
            "headline": ["Plus Jakarta Sans", "sans-serif"],
            "body": ["Inter", "sans-serif"]
          },
          fontSize: {
            "headline-xl": ["36px", { lineHeight: "44px", letterSpacing: "-0.02em", fontWeight: "700" }],
            "headline-lg": ["28px", { lineHeight: "36px", letterSpacing: "-0.01em", fontWeight: "600" }],
            "headline-md": ["22px", { lineHeight: "28px", fontWeight: "600" }],
            "headline-sm": ["18px", { lineHeight: "24px", fontWeight: "600" }],
            "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
            "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
            "body-sm": ["13px", { lineHeight: "18px", fontWeight: "400" }],
            "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "500" }],
            "label-sm": ["11px", { lineHeight: "14px", letterSpacing: "0.05em", fontWeight: "500" }]
          }
        }
      }
    };
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

  <!-- Library Eksternal -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./style.css" />
</head>

<body class="bg-surface font-body text-on-surface min-h-screen relative">

  <!-- ========== LOADING OVERLAY ========== -->
  <div id="app-loader" class="fixed inset-0 z-[100] bg-surface flex items-center justify-center">
    <div class="text-center">
      <div class="w-16 h-16 rounded-2xl bg-primary-container text-primary flex items-center justify-center mx-auto mb-4 animate-pulse">
        <span class="material-symbols-outlined text-3xl">theater_comedy</span>
      </div>
      <p class="font-headline text-on-surface">Memuat SP-PPT...</p>
    </div>
  </div>

  <!-- ========== HALAMAN LOGIN (default) ========== -->
  <div id="page-login" class="hidden"></div>

  <!-- ========== SHELL APLIKASI (sidebar + header + main) ========== -->
  <div id="app-shell" class="hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed left-0 top-0 h-full w-72 bg-surface-container-low z-50 flex flex-col pt-6 pb-6 border-r border-outline-variant/20 transform -translate-x-full lg:translate-x-0 transition-transform duration-300">
      <!-- Branding -->
      <div class="px-6 mb-6 flex items-center gap-3">
        <div class="flex items-center gap-1">
          <img src="./assets/logo-mapel.png" alt="Logo Mapel" class="w-9 h-9 rounded-lg object-cover bg-primary-container p-0.5" onerror="this.style.display='none'" />
          <img src="./assets/logo-sekolah.png" alt="Logo Sekolah" class="w-9 h-9 rounded-lg object-cover bg-primary-container p-0.5" onerror="this.style.display='none'" />
        </div>
        <div class="min-w-0">
          <h1 class="font-headline-sm text-on-surface truncate">SP-PPT</h1>
          <p class="text-label-sm text-on-surface-variant truncate">SMPN 10 Samarinda</p>
        </div>
      </div>

      <!-- Navigasi -->
      <nav id="sidebar-nav" class="flex-1 px-4 space-y-1 overflow-y-auto">
        <!-- Diisi oleh JS -->
      </nav>

      <!-- Logout -->
      <div class="px-4 mt-4 pt-4 border-t border-outline-variant/20">
        <button onclick="App.logout()" class="w-full flex items-center px-4 py-2 rounded-xl text-error hover:bg-error-container/20 transition-all text-body-md font-medium">
          <span class="material-symbols-outlined mr-3">logout</span> Keluar
        </button>
      </div>
    </aside>

    <!-- Overlay mobile -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-40 hidden lg:hidden" onclick="App.toggleSidebar()"></div>

    <!-- Konten utama -->
    <div class="lg:pl-72 min-h-screen flex flex-col">

      <!-- Header -->
      <header class="sticky top-0 z-30 h-16 bg-surface/80 backdrop-blur-xl border-b border-outline-variant/20 flex items-center justify-between px-4 md:px-6">
        <div class="flex items-center gap-3">
          <button onclick="App.toggleSidebar()" class="lg:hidden p-2 rounded-lg hover:bg-surface-container-high">
            <span class="material-symbols-outlined">menu</span>
          </button>
          <span class="text-label-md text-secondary bg-secondary-container/20 px-3 py-1 rounded-full">Seni Budaya &amp; Teater</span>
        </div>

        <div class="flex items-center gap-3">
          <!-- Notifikasi -->
          <button onclick="App.openNotifications()" class="relative p-2 rounded-lg hover:bg-surface-container-high transition-colors">
            <span class="material-symbols-outlined">notifications</span>
            <span id="notif-badge" class="absolute top-1 right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-secondary text-on-secondary text-[10px] font-bold flex items-center justify-center hidden">0</span>
          </button>
          <!-- Profil -->
          <div class="flex items-center gap-2">
            <div class="text-right hidden sm:block">
              <p id="header-user-name" class="text-body-sm font-semibold text-on-surface">—</p>
              <span id="header-user-role" class="inline-block text-label-sm px-2 py-0.5 rounded bg-secondary text-on-secondary">—</span>
            </div>
            <img id="header-avatar" alt="Profil" class="w-9 h-9 rounded-full object-cover bg-surface-container-high" src="" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23272a2c%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2260%22 font-size=%2240%22 text-anchor=%22middle%22 fill=%22%23c4c1fb%22>?</text></svg>'" />
          </div>
        </div>
      </header>

      <!-- Main Content -->
      <main id="main-content" class="flex-1 p-4 md:p-6 pb-24">
        <!-- Diisi oleh router -->
      </main>
    </div>

    <!-- FAB -->
    <div class="fixed bottom-6 right-6 z-40 flex flex-col gap-2">
      <button onclick="App.showModal('modal-kerabat')" class="relative flex items-center gap-2 px-4 py-2 rounded-full bg-tertiary text-on-tertiary shadow-xl hover:opacity-90 transition-all">
        <span class="absolute -top-1 -right-1 flex h-3 w-3">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-secondary opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-secondary"></span>
        </span>
        <span class="material-symbols-outlined">groups</span>
        <span class="text-body-sm font-semibold hidden sm:inline">Kerabat</span>
      </button>
      <button onclick="App.showModal('modal-panduan')" class="flex items-center gap-2 px-4 py-2 rounded-full bg-primary text-on-primary shadow-xl hover:opacity-90 transition-all">
        <span class="material-symbols-outlined">menu_book</span>
        <span class="text-body-sm font-semibold hidden sm:inline">Panduan</span>
      </button>
      <button onclick="App.openWhatsApp()" class="flex items-center gap-2 px-4 py-2 rounded-full bg-secondary text-on-secondary shadow-xl hover:opacity-90 transition-all">
        <span class="material-symbols-outlined">support_agent</span>
        <span class="text-body-sm font-semibold hidden sm:inline">Aduan WA</span>
      </button>
      <button onclick="App.showModal('modal-darurat')" class="flex items-center gap-2 px-4 py-2 rounded-full bg-error text-on-error shadow-xl hover:opacity-90 transition-all">
        <span class="material-symbols-outlined">warning</span>
        <span class="text-body-sm font-semibold hidden sm:inline">Darurat</span>
      </button>
    </div>

    <!-- Panel Notifikasi -->
    <div id="notif-panel" class="fixed top-0 right-0 h-full w-full sm:w-96 bg-surface-container-low z-[60] shadow-2xl translate-x-full transition-transform duration-300 flex flex-col">
      <div class="flex items-center justify-between p-4 border-b border-outline-variant/20">
        <h3 class="font-headline-sm text-on-surface">Notifikasi</h3>
        <button onclick="App.closeNotifications()" class="p-2 rounded-lg hover:bg-surface-container-high">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div id="notif-list" class="flex-1 overflow-y-auto p-4 space-y-3">
        <!-- Diisi oleh JS -->
      </div>
    </div>
    <div id="notif-overlay" class="fixed inset-0 bg-black/60 z-50 hidden" onclick="App.closeNotifications()"></div>

  </div>

  <!-- ========== MODAL CONTAINER ========== -->
  <div id="modal-container" class="fixed inset-0 z-[70] hidden items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
    <div id="modal-content" class="bg-surface-container-low rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-outline-variant/20">
      <!-- Konten diisi oleh JS -->
    </div>
  </div>

  <!-- ========== TOAST ========== -->
  <div id="toast-container" class="fixed top-20 right-6 z-[80] flex flex-col gap-2"></div>

  <!-- ========== SCRIPT ========== -->
  <script src="./script.js"></script>
</body>
</html>
