<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rapor PDF — SP-PPT</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
tailwind.config = { darkMode: 'class', theme: { extend: {
  colors: { surface:'#101415','surface-container-low':'#191c1e','surface-container':'#1d2022','surface-container-high':'#272a2c','surface-container-highest':'#323537','on-surface':'#e0e3e5','on-surface-variant':'#c8c5d0','outline-variant':'#47464f',primary:'#c4c1fb','primary-container':'#1e1b4b',secondary:'#ffb77d','tertiary':'#b4c5ff','error':'#ffb4ab' },
  fontFamily: { headline: ['"Plus Jakarta Sans"','sans-serif'], body: ['Inter','sans-serif'] },
}}};
</script>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="font-body bg-surface text-on-surface min-h-screen">

<div class="fixed inset-0 z-0 pointer-events-none no-print">
  <img src="https://iili.io/nJ1Rcj1.png" alt="" class="w-full h-full object-cover opacity-20" />
  <div class="absolute inset-0" style="background: linear-gradient(to bottom, rgba(16,20,21,0.95), rgba(16,20,21,0.98));"></div>
</div>

<aside id="sidebar" class="hidden lg:flex flex-col fixed left-0 top-0 bottom-0 w-72 glass z-40 border-r border-outline-variant/40 no-print">
  <div class="p-5 border-b border-outline-variant/40 flex items-center gap-3">
    <img src="https://iili.io/nBiviCX.png" alt="" class="w-10 h-10" />
    <div><h1 class="font-headline font-bold text-lg">SP-PPT</h1><p class="text-xs text-on-surface-variant">SMPN 10 Samarinda</p></div>
  </div>
  <nav id="sidebar-nav" class="flex-1 p-3 space-y-1 overflow-y-auto"></nav>
  <div class="p-3 border-t border-outline-variant/40">
    <button id="btn-logout" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-error/10 text-error text-sm"><span class="material-symbols-outlined text-xl">logout</span> Keluar</button>
  </div>
</aside>

<header class="fixed top-0 right-0 left-0 lg:left-72 h-16 glass z-30 border-b border-outline-variant/40 flex items-center justify-between px-4 gap-3 no-print">
  <div class="flex items-center gap-3">
    <button id="btn-menu" class="lg:hidden p-2 rounded-lg hover:bg-surface-container"><span class="material-symbols-outlined">menu</span></button>
    <h2 class="font-headline font-semibold text-lg">Rapor PDF</h2>
  </div>
  <div class="flex items-center gap-2">
    <button id="btn-cetak" class="px-3 py-2 rounded-lg bg-primary text-on-primary text-xs font-medium flex items-center gap-1"><span class="material-symbols-outlined text-sm">print</span> Cetak</button>
    <button id="btn-pdf-lengkap" class="px-3 py-2 rounded-lg bg-secondary text-on-secondary text-xs font-medium flex items-center gap-1"><span class="material-symbols-outlined text-sm">download</span> PDF Lengkap</button>
    <button id="btn-pdf-ringkas" class="px-3 py-2 rounded-lg bg-tertiary text-on-tertiary text-xs font-medium flex items-center gap-1"><span class="material-symbols-outlined text-sm">description</span> PDF Ringkas</button>
  </div>
</header>

<main class="relative z-10 pt-16 lg:pl-72 pb-24 lg:pb-8 no-print-pad">
  <div class="p-4 lg:p-6 max-w-4xl mx-auto">
    <div id="rapor-content" class="bg-white text-black rounded-2xl shadow-2xl p-8 lg:p-10 print:shadow-none"></div>
  </div>
</main>

<nav id="bottom-nav" class="lg:hidden fixed bottom-0 left-0 right-0 glass border-t border-outline-variant/40 z-30 bottom-nav no-print"></nav>
<div id="toast-container" class="fixed top-20 right-4 z-[100] space-y-2"></div>

<script type="module" src="assets/js/rapor.js"></script>
</body>
</html>
